<h1>Welcome!</h1>
<p>You have been gratned access to our platform. Please register to access our beta features!</p>
<h3>Input Types</h3>
<form onsubmit="event.preventDefault(); alert('Form submitted!');">
        
        <div class="input-group">
            <label>button</label>
            <input type="button" value="Click Me" onclick="alert('Button clicked!')">
        </div>

        <div class="input-group">
            <label>checkbox</label>
            <input type="checkbox" id="check1"> <label for="check1" style="width:auto; margin-left:5px;">Check this</label>
        </div>

        <div class="input-group">
            <label>color</label>
            <input type="color" value="#ff0000">
        </div>

        <div class="input-group">
            <label>date</label>
            <input type="date">
        </div>

        <div class="input-group">
            <label>datetime-local</label>
            <input type="datetime-local">
        </div>

        <div class="input-group">
            <label>email</label>
            <input type="email" placeholder="user@example.com">
        </div>

        <div class="input-group">
            <label>file</label>
            <input type="file">
        </div>

        <div class="input-group">
            <label>hidden</label>
            <input type="hidden" value="secret_value">
            <span style="color:gray; font-style:italic;">(Hidden field is present here but invisible)</span>
        </div>

        <div class="input-group">
            <label>image</label>
            <input type="image" src="https://placehold.co/100x40?text=Image+Submit" alt="Submit">
        </div>

        <div class="input-group">
            <label>month</label>
            <input type="month">
        </div>

        <div class="input-group">
            <label>number</label>
            <input type="number" placeholder="123">
        </div>

        <div class="input-group">
            <label>password</label>
            <input type="password" value="password123">
        </div>

        <div class="input-group">
            <label>radio</label>
            <input type="radio" name="r_group" checked> Option A
            <input type="radio" name="r_group"> Option B
        </div>

        <div class="input-group">
            <label>range</label>
            <input type="range" min="0" max="100">
        </div>

        <div class="input-group">
            <label>reset</label>
            <input type="reset" value="Reset Form">
        </div>

        <div class="input-group">
            <label>search</label>
            <input type="search" placeholder="Search...">
        </div>

        <div class="input-group">
            <label>submit</label>
            <input type="submit" value="Submit Form">
        </div>

        <div class="input-group">
            <label>tel</label>
            <input type="tel" placeholder="123-456-7890">
        </div>

        <div class="input-group">
            <label>text</label>
            <input type="text" value="Default text field">
        </div>

        <div class="input-group">
            <label>time</label>
            <input type="time">
        </div>

        <div class="input-group">
            <label>url</label>
            <input type="url" placeholder="https://example.com">
        </div>

        <div class="input-group">
            <label>week</label>
            <input type="week">
        </div>
    </form>
<br>
<button type="text">Sign Up</button>
